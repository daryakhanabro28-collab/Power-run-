name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 (Required for Capacitor 7 & AGP 8.7+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android Platform
        run: |
          npx cap telemetry off || true
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Local Properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m"

      - name: Locate and Prepare Debug APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*debug.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/POWER-RUN-Debug.apk
            ls -lh build-output/
          else
            echo "ERROR: Debug APK not found!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POWER-RUN-Debug-APK
          path: build-output/POWER-RUN-Debug.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "POWER RUN Android Debug APK (Build #${{ github.run_number }})"
          body: |
            ### 🎮 POWER RUN: 2D Adventure Platformer - Android Debug APK
            **Developer:** Daryakhan ABRO
            **Team:** team Mr Pro PrimeX

            #### ✨ What's included in this build:
            - **Gul Sher Abro** added with *Titan Elephant Stomp* (Heavy Tremor & Spikes-to-Coins).
            - **Shahzad Abro** added with *Eclipse Phantom Dash* (Supersonic slice & Magnet).
            - Custom Character Photo Upload hero creator.
            - Clean Romanized Hindi headings & commentary.
            - Progressive stage difficulty and strict 1-by-1 unlocking.
            - Zero free coins economy.

            ⬇️ **Download `POWER-RUN-Debug.apk` below and install directly on your Android phone!**
          files: build-output/POWER-RUN-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
