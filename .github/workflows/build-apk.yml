name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Install Capacitor & Setup Android Platform
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename Debug APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/POWER-RUN-Debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POWER-RUN-Debug-APK
          path: build-output/POWER-RUN-Debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "POWER RUN Android Debug APK (Build ${{ github.run_number }})"
          body: |
            ### 🎮 POWER RUN Android Debug APK
            **Developer:** Daryakhan ABRO
            **Team:** team Mr Pro PrimeX

            #### What's in this build:
            - **Gul Sher Abro** added with *Titan Elephant Stomp* (Earth Tremor & Hazard Converter).
            - **Shahzad Abro** added with *Eclipse Phantom Dash* (Supersonic slice & Magnet).
            - Custom Character Photo Upload hero creator.
            - Clean Romanized Hindi headings & commentary.
            - Progressive stage difficulty and strict 1-by-1 unlocking.
            - Zero free coins economy.

            👉 **Download `POWER-RUN-Debug.apk` below and install directly on your Android phone!**
          files: build-output/POWER-RUN-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
