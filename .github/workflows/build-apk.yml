name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (Required for AGP 8.7+ and Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android Platform
        run: |
          npx cap telemetry off || true
          npx cap sync android

      - name: Configure Android Local Properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Setup Consistent Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PowerRun, OU=TeamMrProPrimeX, O=DaryakhanAbro, L=Karachi, S=Sindh, C=PK"
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug -Pandroid.injected.testOnly=false --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m"

      - name: Locate and Prepare Debug APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -type f -name "*debug.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/POWER-RUN-Debug.apk
            ls -lh build-output/POWER-RUN-Debug.apk
            # Verify APK signature using Android apksigner
            if [ -f "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]; then
              $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose build-output/POWER-RUN-Debug.apk || true
            fi
          else
            echo "ERROR: Debug APK not found!"
            find android/app/build -type f || true
            exit 1
          fi

      - name: Generate Direct Download Link Mirror
        run: |
          echo "### 📦 APK Build Info" >> $GITHUB_STEP_SUMMARY
          ls -lh build-output/POWER-RUN-Debug.apk >> $GITHUB_STEP_SUMMARY
          MIRROR_LINK=$(curl -s --upload-file build-output/POWER-RUN-Debug.apk https://transfer.sh/POWER-RUN-Debug.apk || true)
          if [ -n "$MIRROR_LINK" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 **Direct APK Link (No login, No Zip):** [Download APK]($MIRROR_LINK)" >> $GITHUB_STEP_SUMMARY
            echo "MIRROR_LINK=$MIRROR_LINK" >> $GITHUB_ENV
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POWER-RUN-Debug-APK
          path: build-output/POWER-RUN-Debug.apk
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: "v1.0-build-${{ github.run_number }}"
          name: "🎮 POWER RUN Debug APK (Build #${{ github.run_number }})"
          body: |
            ### 🎮 POWER RUN: 2D Adventure Platformer - Android APK
            **Developer:** Daryakhan ABRO
            **Team:** team Mr Pro PrimeX

            ✅ **Ready to install on Android phone!**

            ⚠️ **IMPORTANT INSTALLATION NOTE**:
            Agar aapke phone par pehle se POWER RUN install hai, toh naya APK install karne se pehle **purana version phone se UNINSTALL (Delete) zaroor karein**!
            Android ki security policy ke mutabiq agar signature update ho jaye toh direct update karne par "App not installed as package appears to be invalid" ka error aata hai. Purana version uninstall kar ke naya APK install karenge toh yeh 100% first try par install ho jayega!

            #### 📲 Installation Instructions:
            1. Download **`POWER-RUN-Debug.apk`** below under **Assets** (Direct APK file, no unzipping needed).
            2. When downloaded, tap **Open**.
            3. If Android shows *"Blocked by Play Protect"* or *"Harmful app blocked"*, tap **More details** and then tap **Install anyway**.
            4. Make sure "Install unknown apps" permission is enabled for Chrome or File Manager in your phone Settings.

            #### ✨ Features in this version:
            - Official 3D Metallic/Neon App Launcher Icon (POWER RUN)
            - Fixed UI Scaling across Portrait & Landscape on all phone screens
            - Full responsive touch controls with high DPI razor-sharp canvas
            - Gul Sher Abro (Titan Stomp) & Shahzad Abro (Eclipse Phantom)
            - Custom Character Photo Upload hero creator
            - Developer section: Daryakhan ABRO (team Mr Pro PrimeX)
          files: build-output/POWER-RUN-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
